name: Renovate (reproduction)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          configurationFile: .renovaterc.json5
          token: "${{ secrets.GITHUB_TOKEN }}"
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: "${{ github.repository }}"
